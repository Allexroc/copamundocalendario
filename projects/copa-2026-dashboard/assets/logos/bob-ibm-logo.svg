  <text x="75" y="120" font-family="monospace" font-size="12" fill="white" text-anchor="middle" font-weight="bold"></></text>
  
  <!-- Braços -->
  <rect x="25" y="100" width="20" height="40" fill="white" rx="8"/>
  <rect x="105" y="100" width="20" height="40" fill="white" rx="8"/>
  
  <!-- Pernas -->
  <rect x="55" y="130" width="15" height="15" fill="#1E90FF" rx="5"/>
  <rect x="80" y="130" width="15" height="15" fill="#1E90FF" rx="5"/>
</svg>

