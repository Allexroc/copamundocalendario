<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste Simples</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; }
    </style>
</head>
<body>
    <h1>Teste Simples - Dashboard Copa 2026</h1>
    <div id="results"></div>
    <div id="groupsContainer"></div>

    <script src="js/data.js?v=20260619-1736"></script>
    <script>
        const results = document.getElementById('results');
        
        // Test 1: Check if WORLD_CUP_2026 exists
        if (typeof WORLD_CUP_2026 !== 'undefined') {
            results.innerHTML += '<p class="success">✅ WORLD_CUP_2026 carregado</p>';
            results.innerHTML += '<p>Teams: ' + Object.keys(WORLD_CUP_2026.teams).length + '</p>';
            results.innerHTML += '<p>Matches: ' + WORLD_CUP_2026.matches.length + '</p>';
            results.innerHTML += '<p>Groups: ' + Object.keys(WORLD_CUP_2026.groupStandings).length + '</p>';
        } else {
            results.innerHTML += '<p class="error">❌ WORLD_CUP_2026 NÃO carregado</p>';
        }

        // Test 2: Check if functions exist
        if (typeof getGroupStandings === 'function') {
            results.innerHTML += '<p class="success">✅ getGroupStandings() existe</p>';
            
            // Test Grupo C
            const grupoC = getGroupStandings('C');
            results.innerHTML += '<h2>Grupo C:</h2>';
            results.innerHTML += '<pre>' + JSON.stringify(grupoC, null, 2) + '</pre>';
        } else {
            results.innerHTML += '<p class="error">❌ getGroupStandings() NÃO existe</p>';
        }

        // Test 3: Try to render a simple group
        const container = document.getElementById('groupsContainer');
        container.innerHTML = '<h2>Teste de Renderização:</h2>';
        
        const standings = getGroupStandings('C');
        if (standings && standings.length > 0) {
            let html = '<table border="1" cellpadding="5"><tr><th>Pos</th><th>Time</th><th>Pts</th></tr>';
            standings.forEach((team, index) => {
                const teamInfo = WORLD_CUP_2026.teams[team.team];
                html += `<tr><td>${index + 1}</td><td>${teamInfo ? teamInfo.name : team.team}</td><td>${team.points}</td></tr>`;
            });
            html += '</table>';
            container.innerHTML += html;
            results.innerHTML += '<p class="success">✅ Grupo C renderizado com sucesso!</p>';
        } else {
            results.innerHTML += '<p class="error">❌ Não foi possível renderizar Grupo C</p>';
        }
    </script>
</body>
</html>
